<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic and Reasoning Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" role="main">
     <h1>Logic Sequence</h1>
     <p class="subtitle">Fill the gaps and the sequence</p>
     <label>Number of terms in the sequence</label>
     <input type="number" id="totalNumbers" value="10" min="5" max="20">
     <label>Gaps amount</label>
     <input type="number" id="totalGaps" value="3" min="1" max="10">
    
     <div>
        <button onclick="mostrarSequencia()">Generate Sequence</button>
        <button onclick="verificarRespostas()">View answers</button>
     </div>

     <div id="sequence" aria-live="polite" role="region" style="margin-top: 2rem;">
             

     </div>

     <div id="results" role="alert" aria-live="assertive">

     </div>

    </div>

</body>
<script src="script.js"></script>
</html>
