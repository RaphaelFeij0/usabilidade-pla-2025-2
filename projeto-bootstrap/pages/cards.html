<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>

<body class="container py-5" >

    <h2>Exemplo de Card</h2>
    <div class="d-flex gap-4 flex-wrap">
    <div class="card" style="width: 18rem; " >
        <img 
        src="../assets/214.png" 
        alt="heracross T pose" 
        class="card-img-top"
        draggable="false"
        style="object-fit: cover;">
    

    <div class="card-body">
        <h5 class="card-title">
            Heracross
        </h5>
        <p class="card-text">
            Pokemon
        </p>
        <a href="index.html" class="btn btn-primary">Voltar</a>
      </div>
    </div>

    <div class="card" style="width: 18rem; " >
        <img 
        src="../assets/protein.png" 
        alt="protein" 
        class="card-img-top"
        draggable="false"
        style="object-fit: cover;">
    

    <div class="card-body">
        <h5 class="card-title">
            Protein
        </h5>
        <p class="card-text">
            Item
        </p>
        <a href="index.html" class="btn btn-primary">Voltar</a>
      </div>
    </div>
    </div>
</body>
</html>
