<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
</head>
<body class="container py-5">
    <h2>Exemplo de Forms</h2>
    <form>
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" class="form-control" placeholder="Digite seu email" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Senha:</label>
            <input type="password" class="form-control" placeholder="Digite sua senha" required >
        </div>

        <button class="btn btn-primary">Enviar</button>
        <a href="index.html" class="btn btn-secondary"style="background-color: blueviolet; border: none;">Voltar</a>
    </form>
    
</body>
</html>
